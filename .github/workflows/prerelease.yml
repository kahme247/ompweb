name: Binary prerelease

# Every commit on main that passed Verify PR becomes a GitHub prerelease carrying the five single binaries,
# named after the time it was created: title 2026-11-01T10:30:00Z, tag 20261101T103000Z (git tags cannot
# hold ":"). Prereleases are never "latest", so the in-app update notice and `v*` releases are unaffected.
on:
  workflow_run:
    workflows: [Verify PR]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prerelease:
    # A manual run publishes main only: from another branch it would ship that branch's unverified code.
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SHA }}
          # npm ci runs dependency install scripts: keep the write token out of .git/config (gh reads GH_TOKEN).
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build
      - name: Build the release binaries
        run: sh scripts/build-release-binaries.sh
      - run: npm run smoke -- --binary release/ompweb-linux-x64/ompweb

      - name: Publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(date -u +%s)
          title=$(date -u -d "@$now" +%Y-%m-%dT%H:%M:%SZ)
          tag=$(date -u -d "@$now" +%Y%m%dT%H%M%SZ)
          subject=$(git log -1 --format=%s "$SHA")
          # A draft first, so a failed upload never leaves a published prerelease missing archives.
          gh release create "$tag" release/ompweb-*.tar.gz release/ompweb-*.zip \
            --repo "$GITHUB_REPOSITORY" --target "$SHA" --draft --prerelease --title "$title" \
            --notes "Binaries built from $GITHUB_REPOSITORY@$SHA ($subject). Not a release: no npm package, no update notice."
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
