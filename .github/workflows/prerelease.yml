name: Binary prerelease

# Every commit on main that passed Verify PR becomes a GitHub prerelease carrying the five single binaries,
# titled with the time it was created (2026-11-01T10:30:00Z), tag 20261101T103000Z-<short sha> (git tags
# cannot hold ":"; the sha keeps parallel runs apart). Prereleases are never "latest", so the in-app update
# notice and `v*` releases are unaffected.
on:
  workflow_run:
    workflows: [Verify PR]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One group per commit: a shared group keeps only one pending run, so a burst of merges would drop commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prerelease:
    # A manual run publishes main only: from another branch it would ship that branch's unverified code.
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SHA }}
          # npm ci runs dependency install scripts: keep the write token out of .git/config (gh reads GH_TOKEN).
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build
      # The omp the runners compile against: the fork's newest integration build, not runner/omp-build.json's pin
      # (not committed back). No such release or a runner that fails tsc against it fails the release.
      - name: Find the newest omp integration build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(gh api repos/ompweb-dev/oh-my-pi/commits/integration-release --jq .sha)
          tag=$(gh api --paginate 'repos/ompweb-dev/oh-my-pi/releases?per_page=100' --jq '.[].tag_name' \
            | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+-int\.[0-9]{12}\.g${sha:0:7}\$" | head -n 1 || true)
          if [ -z "$tag" ]; then
            echo "::error::ompweb-dev/oh-my-pi has no integration release for integration-release ($sha)"
            exit 1
          fi
          echo "OMP_TAG=$tag" >> "$GITHUB_ENV"
      # Without GH_TOKEN: bun install runs the omp packages' scripts.
      - name: Pin the runner to it
        run: npx bun runner/scripts/use-omp-build.ts "$OMP_TAG" && (cd runner && npx bun x tsc -p .)
      - name: Pin the binary release identity
        run: |
          now=$(date -u +%s)
          echo "RELEASE_TITLE=$(date -u -d "@$now" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$(date -u -d "@$now" +%Y%m%dT%H%M%SZ)-$(git rev-parse --short=10 "$SHA")" >> "$GITHUB_ENV"
      - name: Build the release binaries
        env:
          OMP_WEB_RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: sh scripts/build-release-binaries.sh
      - run: npm run smoke -- --binary release/ompweb-linux-x64/ompweb

      - name: Publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="$RELEASE_TITLE"
          tag="$RELEASE_TAG"
          subject=$(git log -1 --format=%s "$SHA")
          # A draft first, so a failed upload never leaves a published prerelease missing archives.
          gh release create "$tag" release/ompweb-*.tar.gz release/ompweb-*.zip \
            --repo "$GITHUB_REPOSITORY" --target "$SHA" --draft --prerelease --title "$title" \
            --notes "Binaries built from $GITHUB_REPOSITORY@$SHA ($subject), omp: ompweb-dev/oh-my-pi $OMP_TAG. Not a release: no npm package, no update notice."
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
