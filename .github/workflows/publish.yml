name: Publish npm package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Verify tag matches package version
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          test "$GITHUB_REF_NAME" = "v$VERSION"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm install --global npm@^11.5.1
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Builds the omp runners too, which the source smoke spawns from runner/release/.
      - name: Build the release binaries
        run: sh scripts/build-release-binaries.sh
      - run: npm run smoke
      - run: npm run smoke -- --binary release/ompweb-linux-x64/ompweb

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            node bin/generate-release-notes.js --tag "$TAG" --output release-notes.md
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file release-notes.md --draft
          fi

      - name: Attach the binaries to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" release/ompweb-*.tar.gz release/ompweb-*.zip --repo "$GITHUB_REPOSITORY" --clobber

      # npm installs get the runner the esbuild way: one prebuilt package per platform, which npm installs only on
      # the matching os/cpu, pinned to this exact version. No install script, no Bun or compile on the user's machine.
      - name: Publish the omp runner packages and pin them
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64; do
            os="${target%-*}"; cpu="${target#*-}"; exe=""
            if [ "$os" = windows ]; then os=win32; exe=.exe; fi
            name="@kahme247/ompweb-omp-$target"
            dir="runner-packages/$target"
            mkdir -p "$dir"
            cp "runner/release/ompweb-omp-$target$exe" "$dir/ompweb-omp$exe"
            cp LICENSE "$dir/"
            node -e 'const [name, version, os, cpu, bin] = process.argv.slice(1); process.stdout.write(JSON.stringify({ name, version, description: "The omp runner ompweb spawns, for one platform", license: "MIT", repository: { type: "git", url: "git+https://github.com/kahme247/ompweb.git" }, os: [os], cpu: [cpu], files: [bin, "LICENSE"] }, null, 2))' "$name" "$VERSION" "$os" "$cpu" "ompweb-omp$exe" > "$dir/package.json"
            if ! npm view "$name@$VERSION" version --registry https://registry.npmjs.org/ >/dev/null 2>&1; then
              (cd "$dir" && npm publish --provenance --access public)
            fi
            npm pkg set "optionalDependencies.$name=$VERSION"
          done

      - name: Publish to npm
        run: |
          PACKAGE_NAME="$(node -p 'require("./package.json").name')"
          VERSION="$(node -p 'require("./package.json").version')"
          if npm view "$PACKAGE_NAME@$VERSION" version --registry https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "$PACKAGE_NAME@$VERSION is already published"
          else
            npm publish --provenance --access public
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  notify-discord:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Post release notes to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          DISCORD_WEBHOOK_URL="$(printf '%s' "$DISCORD_WEBHOOK_URL" | tr -d '\r\n')"
          case "$DISCORD_WEBHOOK_URL" in
            https://discord.com/api/webhooks/*/*) ;;
            *) echo 'DISCORD_RELEASES_WEBHOOK is not a valid Discord webhook URL' >&2; exit 1 ;;
          esac

          RELEASE_JSON="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body,url)"

          jq -n \
            --arg body "$(jq -r '.body' <<<"$RELEASE_JSON")" \
            --arg title "OMPWEB $TAG" \
            --arg url "$(jq -r '.url' <<<"$RELEASE_JSON")" \
            '{
              username: "OMPWEB Releases",
              embeds: [{
                title: $title,
                url: $url,
                description: $body[0:3800],
                color: 15105570,
                footer: {text: "GitHub Release"}
              }]
            }' > discord-release.json

          curl --fail-with-body \
            --header "Content-Type: application/json" \
            --data @discord-release.json \
            "$DISCORD_WEBHOOK_URL"
