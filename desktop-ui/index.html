<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>omp desktop</title>
    <script>
      // Pre-paint theme: apply the dark class before first paint so the
      // window never flashes light in dark mode (and vice versa).
      (function () {
        try {
          var pref = localStorage.getItem("omp-theme");
          var dark = pref === "dark" || (pref !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <style>
      /* Paint the bg before the CSS bundle arrives. */
      html { background: #faf9f6; }
      html.dark { background: #1b1916; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
