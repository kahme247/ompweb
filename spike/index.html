<!doctype html>
<html lang="en" translate="no" class="notranslate">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="google" content="notranslate" />
    <title>omp web</title>
    <link rel="stylesheet" href="../app/globals.css" />
    <script>(function(){try{var t=localStorage.getItem("omp-theme");var d=matchMedia("(prefers-color-scheme: dark)").matches;var res=t==="system"?(d?"dark":"light"):(!t?"omp":t);if(res==="omp")document.documentElement.classList.add("omp");else document.documentElement.classList.add("theme-"+res);document.documentElement.setAttribute("data-theme",res)}catch(e){}})();</script>
  </head>
  <body translate="no" class="notranslate" style="height: 100%; max-height: 100%; overflow: hidden; display: flex; flex-direction: column">
    <div id="root" style="display: contents"></div>
    <script type="module" src="./client.tsx"></script>
  </body>
</html>
